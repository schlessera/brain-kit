<script id="job-posting-jsonld" type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Backend Engineer - Databases - Analytics | Germany | Remote","description":"\u003cp>Grafana Labs is the company behind Grafana Cloud, the fully managed observability platform trusted by more than 10,000 organizations to ensure reliability, resolve incidents faster, and optimize telemetry at scale. Built on open source and open standards and designed for interoperability across any stack, Grafana Cloud brings AI to observability and observability to AI, giving teams (and their agents) unified visibility so they can see, understand, and act on all their disparate data, wherever it lives, and move at the speed of their ambitions. Customers, including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce, rely on Grafana Labs. We are a 100% remote company with team members across 40+ countries, backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at grafana.com and follow us on LinkedIn and X.\u003c/p>\n\u003cp>We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do.\u003c/p>\n\u003cp>You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.\u003c/p>\n\u003cp>\u003cstrong>This is a remote opportunity, and we would be interested in applicants located in Spain, Sweden, UK, Ireland or Germany.\u003c/strong>\u00a0\u003c/p>\n\u003ch4>The Opportunity:\u003c/h4>\n\u003cp>At Grafana Labs, we build observability tools that help users understand, respond to, and improve their systems – regardless of scale, complexity, or tech stack. We recently started a skunkworks initiative with a mission to bring observability to the rest of the business. Our goal is to make Grafana the single best place where humans and AI agents understand and act on real-time data from across the enterprise. As part of this initiative, we are building an AI-native data intelligence system that gives agents reliable, governed access to enterprise context. This system helps agents retrieve the right data, metadata, definitions, lineage, quality signals, and institutional knowledge without every agent builder having to maintain their own brittle context files. The principle is simple: the context system retrieves, agents decide, and data teams maintain the intelligence.\u003c/p>\n\u003cp>The new team is a mix of seasoned Grafanistas and new hires. We operate with a high degree of autonomy and ownership, both as individuals and as a team. Engineers are empowered to make decisions, move quickly, and validate ideas early – while being supported by a deeply collaborative culture that values curiosity, feedback, and cross-functional partnership.\u003c/p>\n\u003cp>We’re looking for a Senior Software (Database) Engineer to help build the underlying storage system for our general purpose data platform. The database layer has both OLAP and OTLP capabilities to support classic analytics queries while also serving up freshly stored data. It embraces the separation of compute and storage and is designed to run on multiple cloud providers. This is an early-stage role on a high-autonomy team, so you should be comfortable working through ambiguity, making pragmatic architectural decisions, and building systems that can evolve from internal dogfooding to production-grade SaaS. As the team matures, there’s a broad opportunity to expand or redefine this role based on impact and initiative.\u003c/p>\n\u003ch4>What You'll Be Doing:\u00a0\u003c/h4>\n\u003cul>\n\u003cli>Take ownership over and build one or multiple parts of the database: Design, implement, test, and operate ingestion, query planning, distributed query execution, data formats, storage formats.\u003c/li>\n\u003cli>Create a scalable SaaS foundation: Help define and build the architecture for a multi-tenant database service, including tenant isolation, usage tracking, quotas, audit logs, background jobs, and reliable service boundaries.\u003c/li>\n\u003cli>Power agent-facing retrieval workflows: Build APIs and database interfaces that allow AI agents, MCP tools, CLIs, and internal applications to retrieve data quickly.\u003c/li>\n\u003cli>Work across product and infrastructure: Partner with the team to make practical tradeoffs between fast experimentation and long-term reliability, especially as the project moves from prototype to production.\u003c/li>\n\u003cli>Operate what you build: Instrument database services with metrics, logs, traces, alerts, and dashboards. Use observability tools to understand system behavior and improve reliability.\u003c/li>\n\u003cli>Contribute to technical direction: Help shape the architecture, service boundaries, storage choices, API contracts, deployment patterns, and engineering practices for a new product area.\u003c/li>\n\u003cli>Effective communication: You’ll be working in a highly dynamic and collaborative environment, so we need someone who can communicate effectively and contribute across teams.\u003c/li>\n\u003cli>Ownership and impact: Take full ownership of the database solutions you develop, ensuring they are not only innovative but also scalable, maintainable, and aligned with real user workflows.\u00a0\u003c/li>\n\u003c/ul>\n\u003ch4>What Makes You a Great Fit:\u003c/h4>\n\u003cul>\n\u003cli>Strong engineering skills: Solid experience building production-grade, user-facing software systems. You’re a self-starter, capable of tackling complex engineering problems and making design decisions with minimal supervision.\u003c/li>\n\u003cli>AI experience with a practical mindset: You’re familiar with AI technologies and frameworks, and you focus on delivering high-quality solutions that work in the real world, not just in theory.\u00a0\u003c/li>\n\u003cli>Quick iteration and experimentation: You’re comfortable releasing prototypes, collecting feedback, and iterating with a pragmatic mindset.\u003c/li>\n\u003cli>Proven initiative: You take ownership and drive projects forward, pushing boundaries to find the most impactful solutions. You can deal with ambiguity and are able to define scope where things are loosely defined.\u00a0\u003c/li>\n\u003cli>Collaborative attitude: You communicate effectively with your peers. You’re open to feedback, and you bring a solutions-oriented mindset to the table.\u003c/li>\n\u003cli>Experience with distributed systems, catalogs and table formats, query engines.\u003c/li>\n\u003cli>Mastery of a programming language like golang, C++, or Rust\u003c/li>\n\u003cli>Proven track record of delivering software that made it into production and is actively used by users.\u00a0\u003c/li>\n\u003cli>Exposure to working in cloud-native environments (e.g., AWS, GCP, Azure).\u003c/li>\n\u003cli>Experience using observability tools to understand and troubleshoot system behavior.\u003c/li>\n\u003c/ul>\n\u003ch4>Bonus Points for:\u003c/h4>\n\u003cul>\n\u003cli>Experience building distributed query engines.\u003c/li>\n\u003cli>Experience building data warehouses and/or data lakes.\u003c/li>\n\u003cli>Experience building tools for data engineering.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>How we work:\u003c/strong>\u003c/p>\n\u003cp>We are a remote-first team that meets regularly over video and does most of our work asynchronously, in writing. We value creativity, diverse perspectives, and clear communication. Tempo is relied upon by prominent global organizations to monitor critical applications and infrastructure, and we expect everyone on the team, including our Staff engineers, to contribute ideas that make it a more reliable, more useful, and more loved product.\u003c/p>\n\u003cp>\u003cstrong>Compensation &#x26; Rewards:\u003c/strong>\u003c/p>\n\u003cp>In Germany, the Base compensation range for this role is EUR 97,000\u00a0- EUR 121,000.\u00a0 Actual compensation may vary based on level, experience, and skillset as assessed in the interview process. Benefits include equity, bonus (if applicable) and other benefits listed here.\u003c/p>\n\u003cp>\u003cem>*Compensation ranges are country specific. If you are applying for this role from a different location than listed above, your recruiter will discuss your specific market’s defined pay range &#x26; benefits at the beginning of the process\u003c/em>\u003c/p>\n\u003cp>\u003cem>*Compensation ranges are country specific. If you are applying for this role from a different location than listed above, your recruiter will discuss your specific market’s defined pay range &#x26; benefits at the beginning of the process.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Why You’ll Thrive at Grafana Labs:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>100% Remote, Global Culture -\u003c/strong>\u00a0As a remote-only company, we bring together talent from around the world, united by a culture of collaboration and shared purpose.\u003c/li>\n\u003cli>\u003cstrong>Scaling Organization\u003c/strong> – Tackle meaningful work in a high-growth, ever-evolving environment.\u003c/li>\n\u003cli>\u003cstrong>Transparent Communication\u003c/strong> – Expect open decision-making and regular company-wide updates.\u003c/li>\n\u003cli>\u003cstrong>Innovation-Driven\u003c/strong> – Autonomy and support to ship great work and try new things.\u003c/li>\n\u003cli>\u003cstrong>Open Source Roots\u003c/strong> – Built on community-driven values that shape how we work.\u003c/li>\n\u003cli>\u003cstrong>Empowered Teams\u003c/strong> – High trust, low ego culture that values outcomes over optics.\u003c/li>\n\u003cli>\u003cstrong>Career Growth Pathways\u003c/strong> – Defined opportunities to grow and develop your career.\u003c/li>\n\u003cli>\u003cstrong>Approachable Leadership\u003c/strong> – Transparent execs who are involved, visible, and human.\u003c/li>\n\u003cli>\u003cstrong>Passionate People\u003c/strong> – Join a team of smart, supportive folks who care deeply about what they do.\u003c/li>\n\u003cli>\u003cstrong>In-Person onboarding\u003c/strong> - We want you to thrive from day 1 with your fellow new ‘Grafanistas’ to learn all about what we do and how we do it.\u00a0\u003c/li>\n\u003cli>\u003cstrong>Balance is Key\u003c/strong> - We operate a global annual leave policy of 30 days per annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown Days to allow the team to really disconnect. \u003cem>*We will comply with local legislation where applicable.\u003c/em>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Equal Opportunity Employer:\u003c/strong> \u003cem>Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.\u003c/em>\u003c/p>\n\u003cp>\u003cem>Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.\u003c/em>\u003c/p>\n\u003cp>#LI-Remote\u003c/p>\n\u003cp>\u003cem>For information about how your personal data is used once you’ve applied to a job, check out our privacy policy.\u003c/em>\u003c/p>","datePosted":"2026-09-22T08:17:08+00:00","hiringOrganization":{"@type":"Organization","name":"Grafana Labs"},"url":"https://www.remotely.de/job/grafana-labs-senior-backend-engineer-databases-analytics-germany-remote","identifier":{"@type":"PropertyValue","name":"remotelyJobId","value":718323},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":[{"@type":"Country","name":"Spain"},{"@type":"Country","name":"SE"},{"@type":"Country","name":"United Kingdom"},{"@type":"Country","name":"IE"},{"@type":"Country","name":"Germany"}]}</script>
