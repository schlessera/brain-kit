<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org/","@type":"JobPosting","title":"Customer Support Associate","description":"\u003cdiv>\u003cp>\u003cb>Company Overview:\u003c/b>\u003c/p>\u003cp>\nEmpower is a fast-growing startup that is on a mission to transform the gig economy, so that hard-working drivers can earn a sustainable living. If you want to be an integral member of a team that is disrupting Uber and cares about making a difference for gig economy workers, then we&rsquo;d like to hear from you.\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cb>\nRole Overview:\u003c/b>\u003c/p>\u003cp>\nEmpower is hiring Customer Support Associates. Customer Support Associates at Empower are responsible for addressing and solving driver and rider issues on the Empower platform in a timely manner that drives customer satisfaction.\u003c/p>\u003cp>\u003c/p>\u003cp>\nThis is a remote, work-from-home position from anywhere in the United States.\u003c/p>\u003cp>\u003c/p>\u003cp>\u003cb>\nDetailed Responsibilities:\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cp>\nMaintain a comprehensive understanding of the Empower platform, including both the driver and rider mobile applications\u003c/p>\u003c/li>\u003cli>\u003cp>\nEnsure timely correspondence with customers via phone and email\u003c/p>\u003c/li>\u003cli>\u003cp>\nIdentify customer needs and address their problems with a positive attitude\u003c/p>\u003c/li>\u003cli>\u003cp>\nEscalate issues and trends that require broader attention\u003c/p>\u003c/li>\u003cli>\u003cp>\nPrepare and present product/service recommendations that will decrease the volume of customer issues in the future\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003cb>\nCandidate Requirements:\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cp>\n1 year of customer support experience\u003c/p>\u003c/li>\u003cli>\u003cp>\nDetail-oriented, high-energy, driven problem-solver with an exceptional work ethic and a desire to be part of a team disrupting the status quo\u003c/p>\u003c/li>\u003cli>\u003cp>\nPolished written and verbal communication skills\u003c/p>\u003c/li>\u003cli>\u003cp>\nStrong organizational skills and the ability to multitask\u003c/p>\u003c/li>\u003cli>\u003cp>\nProficiency in CRM software and ticketing systems such as Zendesk\u003c/p>\u003c/li>\u003cli>\u003cp>\nTeam-first mentality and a professional attitude\u003c/p>\u003c/li>\u003cli>\u003cp>\nFlexible schedule, requiring weekend shifts\u003c/p>\u003c/li>\u003cli>\u003cp>\nYou exhibit patience when handling tough situations\u003c/p>\u003c/li>\u003cli>\u003cp>\nYou take a startup (all-hands-on-deck), &ldquo;I bust my butt because I love it&rdquo; approach\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003cb>\nPreferred Experience:\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cp>\nExperience in a customer support role or call center environment\u003c/p>\u003c/li>\u003cli>\u003cp>\nExperience at a startup or in a similarly intense environment\u003c/p>\u003c/li>\u003cli>\u003cp>\nFamiliarity with for-hire transportation industry and gig economy\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003cb>\nWhat Do We Offer?\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cp>\nCompetitive compensation $20-$22/hr + equity + performance-based bonus\u003c/p>\u003c/li>\u003cli>\u003cp>\nCompetitive benefits package\u003c/p>\u003c/li>\u003cli>\u003cp>\nBeing part of a great team to better the lives of gig workers\u003c/p>\u003c/li>\u003cli>\u003cp>\nWork from home\u003c/p>\u003c/li>\u003c/ul>\u003cp>\nSuccessful applicants will need to complete a background check.\u003c/p>\u003cp>\u003cb>\nAt this time, we are not accepting submissions from external recruiters.\u003c/b>\u003c/p>\u003c/div>","datePosted":"2026-08-19T05:00:00.000Z","hiringOrganization":{"@type":"Organization","name":"Empower","logo":null},"applicantLocationRequirements":{"@type":"Country","name":"USA"},"jobLocationType":"TELECOMMUTE","baseSalary":{"@type":"MonetaryAmount","currency":"
