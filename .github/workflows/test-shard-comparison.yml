name: Test shard comparison

on:
  push:
    branches: [chore/629-three-test-shards]

permissions:
  contents: read

jobs:
  compare:
    name: balanced-wall-${{ matrix.shard }}-3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare the identical test and package source revision
        run: git restore --source=ac5741eb9fecd9b0048a85de8a39261aa1ca58c7 --staged --worktree -- packages tests
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Chrome for the renderer runtime tests
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium on this runner."
            exit 1
          fi
          "$CHROME" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Unit + integration tests (keyless, deterministic)
        run: bun run test --balanced-shard=${{ matrix.shard }}/3 --reporter=junit --reporter-outfile="$RUNNER_TEMP/balanced-wall-${{ matrix.shard }}-3.xml"
        env:
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          BRAIN_REQUIRE_CHROME: "1"
      - name: File timings and executed tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: balanced-wall-${{ matrix.shard }}-3
          path: ${{ runner.temp }}/balanced-wall-${{ matrix.shard }}-3.xml
          if-no-files-found: error
