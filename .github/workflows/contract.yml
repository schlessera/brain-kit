# A change to docs/integration-contract.md is a contract change. Its PR is
# titled `CONTRACT:` and labelled `contract`, and a PR that is titled or
# labelled that way changes the doc. The rule is scripts/check-contract-pr.ts;
# CONTRIBUTING.md says what it enforces.
#
# This is its own workflow rather than a job in ci.yml because the verdict
# depends on the title and the labels, and editing either must re-run it.
# Adding `edited` and `labeled` to ci.yml would re-run the whole suite on
# every label change.
#
# The title and labels reach the script through environment variables, never
# through an expression inside `run`: a PR title is attacker-controlled text.
name: contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Match the CONTRACT title and label to the contract doc
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun scripts/check-contract-pr.ts "$BASE_REF"
