name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Typecheck (strict)
        run: bunx tsc --noEmit
      - name: Unit + integration tests (keyless, deterministic)
        run: bun test packages
        env:
          # Belt and braces: tests must never reach for real providers.
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""

  pack:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack all workspaces
        run: |
          set -euo pipefail
          TARBALL_DIR="$RUNNER_TEMP/endoxa-tarballs"
          mkdir -p "$TARBALL_DIR"
          for package in \
            core \
            ui-sdk \
            ui-backend-claude \
            ui-backend-pi \
            ui-render-puppeteer \
            module-finance \
            module-jobs \
            module-speaking
          do
            (cd "packages/$package" && \
              bun pm pack --filename "$TARBALL_DIR/$package.tgz")
            TARBALL_CONTENTS=$(tar -tzf "$TARBALL_DIR/$package.tgz")
            grep -q "^package/dist/index.js" <<< "$TARBALL_CONTENTS"
            if [ "$package" = core ]; then
              grep -q "^package/dist/cli/brain.js" <<< "$TARBALL_CONTENTS"
              grep -q "^package/dist/hooks/" <<< "$TARBALL_CONTENTS"
            fi
          done
      - name: Install and smoke-test packed packages
        run: |
          set -euo pipefail
          TARBALL_DIR="$RUNNER_TEMP/endoxa-tarballs"
          CONSUMER_DIR="$RUNNER_TEMP/endoxa-consumer"
          mkdir -p "$CONSUMER_DIR"
          cd "$CONSUMER_DIR"
          bun -e '
            const tarballs = "../endoxa-tarballs";
            await Bun.write("package.json", JSON.stringify({
              name: "endoxa-pack-smoke",
              private: true,
              type: "module",
              overrides: {
                "@endoxa/core": `file:${tarballs}/core.tgz`,
                "@endoxa/ui-sdk": `file:${tarballs}/ui-sdk.tgz`,
                "@endoxa/ui-backend-claude": `file:${tarballs}/ui-backend-claude.tgz`,
                "@endoxa/ui-backend-pi": `file:${tarballs}/ui-backend-pi.tgz`,
                "@endoxa/ui-render-puppeteer": `file:${tarballs}/ui-render-puppeteer.tgz`,
                "@endoxa/module-finance": `file:${tarballs}/module-finance.tgz`,
                "@endoxa/module-jobs": `file:${tarballs}/module-jobs.tgz`,
                "@endoxa/module-speaking": `file:${tarballs}/module-speaking.tgz`,
              },
            }, null, 2) + "\n");
          '
          bun add "$TARBALL_DIR"/*.tgz
          bun -e '
            const names = [
              "@endoxa/core",
              "@endoxa/ui-sdk",
              "@endoxa/ui-backend-claude",
              "@endoxa/ui-backend-pi",
              "@endoxa/ui-render-puppeteer",
              "@endoxa/module-finance",
              "@endoxa/module-jobs",
              "@endoxa/module-speaking",
            ];
            for (const name of names) {
              const loaded = await import(name);
              if (!loaded || typeof loaded !== "object") {
                throw new Error(`Failed to import ${name}`);
              }
            }
            const claude = await import("@endoxa/ui-backend-claude");
            if (typeof claude.createClaudeBackend !== "function") {
              throw new Error("createClaudeBackend export is missing");
            }
          '
          node --input-type=module <<'NODE'
          const nodePackages = [
            "@endoxa/ui-sdk",
            "@endoxa/ui-sdk/protocol",
            "@endoxa/ui-sdk/schemas",
            "@endoxa/ui-sdk/server",
            "@endoxa/ui-sdk/client",
            "@endoxa/ui-backend-claude",
            "@endoxa/ui-render-puppeteer",
          ];
          for (const name of nodePackages) {
            const loaded = await import(name);
            if (!loaded || typeof loaded !== "object") {
              throw new Error(`Node failed to import ${name}`);
            }
          }

          const bunApiPackages = [
            "@endoxa/core",
            "@endoxa/module-finance",
            "@endoxa/module-jobs",
            "@endoxa/module-speaking",
            "@endoxa/ui-backend-pi",
          ];
          for (const name of bunApiPackages) {
            try {
              await import(name);
            } catch (error) {
              const message = `${error?.code ?? ""}: ${error?.message ?? error}`;
              const relativeSpecifierFailure =
                error?.code === "ERR_MODULE_NOT_FOUND" &&
                /(?:from|module)\s+['"]?\.{1,2}\//.test(message);
              if (!message.includes("bun:") || relativeSpecifierFailure) {
                throw new Error(
                  `${name} failed for a reason other than its documented bun: dependency:\n${message}`
                );
              }
            }
          }
          NODE
          ./node_modules/.bin/brain --version

  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Personal-string leakage gate
        # plan/ and research/ intentionally reference the private setup and are
        # excluded from the public release cut; everything else must be clean.
        run: |
          set -e
          # Pattern is assembled from pieces so this workflow file does not
          # itself trip the gate. The former GitHub org spelling is caught
          # too since the rename to the public org name.
          P1='al''ain'; P2='schles''ser'; P3='car''ole'; P4='buf''fy'; P5='wyv''ern'
          PATTERN="$P1|$P2|$P3|$P4|$P5"
          MATCHES=$(grep -riE "$PATTERN" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=plan \
            --exclude-dir=research \
            --exclude=PROGRESS.md \
            --exclude=AGENTS.md \
            --exclude=LICENSE \
            . || true)
          if [ -n "$MATCHES" ]; then
            echo "Personal strings found outside allowed locations:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Leakage gate clean."
