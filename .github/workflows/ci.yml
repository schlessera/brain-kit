  proof:
    # Evaluate even after failures or skips; never interpret missing selected proof as green.
    needs: [changeset, verify, pack, unit, runtime, browser, layout, captures]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
