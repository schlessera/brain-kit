# Bounded diagnostic branch only. Never merge this workflow replacement.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: d3501ed7cce0bc0e3d3da437cadbcddc945e2436
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile --backend=copyfile
      - name: Offline metadata-only Worker audit
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_uid=$(id -u)
          diagnostic_gid=$(id -g)
          diagnostic_groups=$(id -G | tr ' ' ',')
          sudo unshare --net -- setpriv --reuid="$diagnostic_uid" --regid="$diagnostic_gid" --groups="$diagnostic_groups" \
            env PATH="$PATH" HOME="$HOME" bun -e '
          import {readFileSync} from "node:fs";
          import {browserInventory,proofInputs,checkout} from "./scripts/proof-inputs";
          import {WorkerAuditError,logWorkerAuditDiagnostic} from "./scripts/browser-worker-audit";
          const root=process.cwd();
          const interfaces=readFileSync("/proc/net/dev","utf8").trim().split("\n").slice(2).map(line=>line.split(":")[0].trim());
          if(JSON.stringify(interfaces)!==JSON.stringify(["lo"]))throw Error("DIAGNOSTIC_OFFLINE_NAMESPACE_REQUIRED");
          const identity={checkout:checkout(root),networkInterfaces:interfaces,bun:Bun.version,node:Bun.spawnSync(["node","--version"]).stdout.toString().trim(),scope:"metadata-only-not-execution-proof"};
          await Bun.write("tmp/worker-audit-identity.json",JSON.stringify(identity,null,2));
          try {
            const inventory=await browserInventory(root);
            const inputs=proofInputs(root,"browser",inventory,"hosted-metadata-diagnostic-only");
            await Bun.write("tmp/worker-audit-diagnostic.json",JSON.stringify({qualified:true,inputs},null,2));
            console.log("WORKER_AUDIT_QUALIFIED "+JSON.stringify({native:inputs.nativeDiagram,selected:inputs.inventory.length}));
          } catch(error) {
            if(error instanceof WorkerAuditError){
              logWorkerAuditDiagnostic(error);
              await Bun.write("tmp/worker-audit-diagnostic.json",JSON.stringify({qualified:false,...error.diagnostic},null,2));
            } else {
              console.log("WORKER_AUDIT_UNAVAILABLE_BEFORE_DIAGNOSTIC");
              await Bun.write("tmp/worker-audit-diagnostic.json",JSON.stringify({qualified:false,reason:"metadata-discovery-or-input-closure-unavailable"}));
            }
            process.exitCode=1;
          }
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bounded-worker-audit
          path: tmp/worker-audit-*.json
          if-no-files-found: error
          retention-days: 7
