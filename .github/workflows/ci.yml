# Temporary measurement branch only. Never merge this workflow replacement.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Own frozen dependency install
        run: bun install --frozen-lockfile --backend=copyfile
      - name: Same-source offline compilation comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(nproc)" = 4
          compile_uid=$(id -u)
          compile_gid=$(id -g)
          compile_groups=$(id -G | tr ' ' ',')
          sudo unshare --net -- setpriv --reuid="$compile_uid" --regid="$compile_gid" --groups="$compile_groups" \
            env PATH="$PATH" HOME="$HOME" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            python3 experiments/compile2321/measure.py --workers=${{ matrix.workers }} --report="$RUNNER_TEMP/compile2321-${{ matrix.workers }}"
      - name: Immutable measurement receipts and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile2321-N${{ matrix.workers }}
          path: ${{ runner.temp }}/compile2321-${{ matrix.workers }}/
          if-no-files-found: error
          retention-days: 7
