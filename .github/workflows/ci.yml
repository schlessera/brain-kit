name: CI

on:
  workflow_dispatch:
    inputs:
      unit_measurement:
        description: "Temporary issue 2121 corrected queued unit measurement"
        type: boolean
        default: false
      namespace_only:
        description: "Temporary issue 2121 cheap namespace prerequisites only"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  actions: read
  checks: read

# Cancel obsolete PR heads. Preserve every integrated main commit's evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Drafts run cheap gates; synchronize gives fast feedback. Open/ready/reopen
# requests final affected confirmation. The proof gate refuses intermediate feedback.
# Independent jobs start together; each PR owns its cancellation group (#1326).
jobs:
  changeset:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      cadence: ${{ steps.plan.outputs.cadence }}
      endurance: ${{ steps.plan.outputs.endurance }}
      runtime: ${{ steps.plan.outputs.runtime }}
      captures: ${{ steps.plan.outputs.captures }}
      layout: ${{ steps.plan.outputs.layout }}
      browser: ${{ steps.plan.outputs.browser }}
      unit: ${{ steps.plan.outputs.unit }}
      verify: ${{ steps.plan.outputs.verify }}
      pack: ${{ steps.plan.outputs.pack }}
      run_browser: ${{ steps.reuse.outputs.run_browser }}
      run_layout: ${{ steps.reuse.outputs.run_layout }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Plan affected fast and local checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: bun scripts/ci-plan.ts
      - name: Discover product scenario and assertion ownership
        if: steps.plan.outputs.cadence != 'draft'
        run: bun scripts/proof-inventory.ts
      - name: Lint, leakage and contribution workflow guards
        run: bun run lint
      - name: Env documentation matches its descriptors
        run: bun scripts/env-docs.ts --check
      - name: Validate all pending changeset package names
        run: bun scripts/check-changeset-packages.ts
      - name: Require a changeset for shipped package changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun scripts/check-changeset.ts "$BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            bun scripts/check-changeset.ts "$BEFORE_SHA"
          fi
      - name: Retain only validated equivalent automatic proof
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: bun scripts/proof-reuse.ts
      - name: Retention ledger and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-reuse-ledger
          path: |
            tmp/proof-reuse.json
            tmp/proof-inventory.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    # Packaging and verification are independent after cheap rejection gates.
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute the same affected selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Strict types and curated fast tests concurrently on this runner
        run: bun scripts/ci-runner.ts

  pack:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.pack == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack, install and probe every publishable package
        # One table-driven script (scripts/ci-pack.ts): workspace pins first,
        # then each package's tarball entries, Bun and Node consumer imports
        # and probes, bins, the packed query/inbox checks, the published type
        # surface and the React 18 consumer. `bun run check:pack` runs this
        # job locally, so both run the same probes.
        run: bun scripts/ci-pack.ts

  unit:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    # Retain all native controls; measured full partitions need bounded outer capacity (#1485).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # Native source freezes require dependency inodes owned by this checkout.
      - run: bun install --frozen-lockfile --backend=copyfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        run: bash scripts/ci-runtime-setup.sh
      - name: Complete unit proof
        run: bun scripts/ci-proof.ts unit --shard=${{ matrix.shard }}/4
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-proof-${{ matrix.shard }}
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  runtime:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        run: bash scripts/ci-runtime-setup.sh --native
      # Diagnostic only: names the task that queues each deleted checkpoint (#1967).
      - name: Start btrfs dead-root kernel trace
        run: |
          mkdir -p tmp/native-host-proof
          sudo bash scripts/native-proof/dead-root-trace.sh start tmp/native-host-proof/dead-root-trace.txt
      - name: Complete runtime proof
        run: bun scripts/ci-proof.ts runtime
      - name: Stop and classify btrfs dead-root kernel trace
        if: always()
        run: |
          sudo bash scripts/native-proof/dead-root-trace.sh stop
          if [ -f tmp/native-host-proof/dead-root-trace.txt ]; then
            bun scripts/native-proof/dead-root-trace.ts tmp/native-host-proof/dead-root-trace.txt tmp/native-host-proof
          fi
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-proof
          path: |
            tmp/native-host-proof/
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  browser:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.browser == 'true' && needs.changeset.outputs.run_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Complete browser proof
        run: bun scripts/ci-proof.ts browser --shard=${{ matrix.shard }}/2
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-proof-${{ matrix.shard }}
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/proof-cases.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  layout:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.layout == 'true' && needs.changeset.outputs.run_layout == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Complete layout proof
        run: bun scripts/ci-proof.ts layout --shard=${{ matrix.shard }}/2
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-proof-${{ matrix.shard }}
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/proof-cases.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  captures:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.captures == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Complete captures proof
        run: bun scripts/ci-proof.ts captures
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-proof
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  endurance:
    needs: changeset
    if: inputs.unit_measurement != true && needs.changeset.outputs.endurance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-plan.ts
      - name: Complete endurance proof
        run: bun scripts/ci-proof.ts endurance
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endurance-proof
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/proof-cases.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-timings.json
            tmp/measure-claude-*.json
            tmp/*-probe.json
            tmp/feature-capture-verification/
            packages/ui-kit/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  proof:
    name: ${{ github.event_name == 'pull_request' && 'proof' || 'integrated or exhaustive proof' }}
    # Evaluate even after failures or skips; never interpret missing selected proof as green.
    needs: [changeset, verify, pack, unit, runtime, browser, layout, captures, endurance]
    if: ${{ always() && !cancelled() && inputs.unit_measurement != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Require every selected proof category to pass
        env:
          PROOF_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-proof.ts aggregate

  unit-measurement:
    if: github.event_name == 'workflow_dispatch' && inputs.unit_measurement == true && inputs.namespace_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workers: [2]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 9e7a178f28025648109c6e2fb23d2bf325f813ed
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --backend=copyfile
      - name: Exhaustive same-SHA selection
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        run: bash scripts/ci-runtime-setup.sh
      - name: Complete measured unit proof
        run: bun scripts/ci-proof.ts unit --shard=${{ matrix.shard }}/4 --workers=${{ matrix.workers }}
      - name: Immutable measured receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-measurement-${{ matrix.workers }}-${{ matrix.shard }}
          path: |
            tmp/proof-checkout.json
            tmp/proof-resources.json
            tmp/unit-report.xml
            tmp/unit-report-summary.json
            tmp/unit-worker-*.xml
            tmp/unit-worker-*.json
            tmp/unit-timings.json
          retention-days: 7
  unit-worker-guard-measurement:
    if: github.event_name == 'workflow_dispatch' && inputs.unit_measurement == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.namespace_only == true && '9e7a178f28025648109c6e2fb23d2bf325f813ed' || 'd60460382bfce736f1b897b0da444d6a2cad772f' }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Native namespace prerequisites
        run: bash scripts/ci-runtime-setup.sh
      - name: Pinned offline Docker control prerequisite
        if: inputs.namespace_only == true
        run: docker pull mcr.microsoft.com/playwright:v1.63.0-noble
      - name: Immutable namespace source and real controls
        if: inputs.namespace_only == true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          git show -s --format='%H %T %P' HEAD | tee tmp/2121-namespace-source.txt
          sha256sum scripts/unit-workers.ts scripts/unit-worker-entry.sh tests/unit-workers.test.ts tests/helpers/unit-worker-fixture.ts | tee -a tmp/2121-namespace-source.txt
          ledger=$(mktemp -d /tmp/brain-unit-namespace-control.XXXXXX)
          trap 'rm -rf -- "$ledger"' EXIT
          unshare --user --map-current-user --keep-caps --mount bash scripts/unit-worker-entry.sh "$ledger" bun run test "$PWD/tests/workspace-lease.test.ts" "$PWD/tests/test-network-guard.test.ts" "$PWD/packages/ui-sdk/tests/maintenance-temp-budget.test.ts" "$PWD/packages/ui-sdk/tests/maintenance-worker.test.ts" "$PWD/tests/unit-workers.test.ts" 2>&1 | tee tmp/2121-namespace-controls.log
      - name: Queued-worker external-fetch mutation fails and production source is restored
        if: inputs.namespace_only != true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          set +e
          bun scripts/unit-workers.ts "$PWD/tests/2121-worker-guard.test.ts" "$PWD/tests/2121-worker-control.test.ts" > tmp/2121-offline-worker.log 2>&1
          code=$?
          set -e
          cat tmp/2121-offline-worker.log
          test "$code" -ne 0
          grep -q 'Offline test guard: attempted real network access' tmp/2121-offline-worker.log
          grep -q '2121 queued-worker external-fetch mutation' tmp/2121-offline-worker.log
          grep -q 'QUEUED_WORKER_PID' tmp/2121-offline-worker.log
          git checkout 9e7a178f28025648109c6e2fb23d2bf325f813ed
          test ! -e tests/2121-worker-guard.test.ts
          test ! -e tests/2121-worker-control.test.ts
          test "$(git rev-parse HEAD)" = 9e7a178f28025648109c6e2fb23d2bf325f813ed
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-worker-guard-mutation
          path: |
            tmp/2121-namespace-source.txt
            tmp/2121-namespace-controls.log
            tmp/2121-offline-worker.log
            tmp/unit-worker-checkouts.json
            tmp/unit-worker-*.xml
            tmp/unit-worker-*.json
          retention-days: 7
