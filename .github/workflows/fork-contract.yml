# GENERATED by scripts/fork-ci-adapters.ts from .depot/workflows/contract.yml. Do not edit.
# Change the Depot source, then run `bun scripts/fork-ci-adapters.ts --write`.
#
# Depot CI does not receive pull requests from forks, so GitHub Actions runs
# these gates for them, and only for them. Depot keeps same-repository PRs
# and main. Adaptations: pull_request trigger only, fork-only job routing,
# `fork / <job>` check names, GitHub-hosted runners and non-persisted
# checkout credentials. See docs/decisions/claude-code-runtime.md,
# "Fork pull requests fall back to GitHub Actions (#988)".

# A change to docs/integration-contract.md is a contract change. Its PR is
# titled `CONTRACT:` and labelled `contract`, and a PR that is titled or
# labelled that way changes the doc. The rule is scripts/check-contract-pr.ts;
# CONTRIBUTING.md says what it enforces.
#
# This is its own workflow rather than a job in ci.yml because the verdict
# depends on the title and the labels, and editing either must re-run it.
# Adding `edited` and `labeled` to ci.yml would re-run the whole suite on
# every label change.
#
# The title and labels reach the script through environment variables, never
# through an expression inside `run`: a PR title is attacker-controlled text.
name: contract (fork fallback)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job carries the same `if:`: Depot runs pushes and same-repository
# pull requests, and a fork PR runs on GitHub Actions instead, from the
# adapter scripts/fork-ci-adapters.ts generates out of this file. Change a
# gate here, then run `bun scripts/fork-ci-adapters.ts --write`.
jobs:
  contract:
    name: fork / contract
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      # The PR's head commit, not the default synthetic merge commit: the
      # merge commit, diffed against the base, drops a doc edit that also
      # landed on the base through another PR. Full history for the merge base.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Match the CONTRACT title and label to the contract doc
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun scripts/check-contract-pr.ts "$BASE_REF" "$HEAD_SHA"
