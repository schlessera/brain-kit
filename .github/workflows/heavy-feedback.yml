# Generated by scripts/heavy-feedback-workflow.ts from ci.yml; do not edit.
# Draft heavy feedback (#3272) runs a draft PR's affected heavy categories with
# the same jobs and pins as confirmation. It is never `proof`; request it with
# `bun scripts/request-heavy-feedback.ts <pr>`.
name: Draft heavy feedback
"on":
  workflow_dispatch:
    inputs:
      pr:
        description: Draft PR number
        required: true
        type: string
      head_sha:
        description: Exact live head SHA of that PR
        required: true
        type: string
  pull_request:
    types:
      - synchronize
      - ready_for_review
      - closed
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: "heavy-feedback-${{ github.event.pull_request.number || inputs.pr }}"
  cancel-in-progress: true
jobs:
  supersede:
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: "Cancel this PR's in-flight draft heavy feedback"
        run: "echo 'A newer head or readiness change superseded draft heavy feedback for this PR.'"
  changeset:
    name: heavy feedback admission
    if: "github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      cadence: "${{ steps.plan.outputs.cadence }}"
      endurance: "${{ steps.plan.outputs.endurance }}"
      runtime: "${{ steps.plan.outputs.runtime }}"
      runtime_host: "${{ steps.plan.outputs.runtime_host }}"
      captures: "${{ steps.plan.outputs.captures }}"
      layout: "${{ steps.plan.outputs.layout }}"
      browser: "${{ steps.plan.outputs.browser }}"
      unit: "${{ steps.plan.outputs.unit }}"
      unit_shards: "${{ steps.plan.outputs.unit_shards }}"
      verify: "${{ steps.plan.outputs.verify }}"
      pack: "${{ steps.plan.outputs.pack }}"
      run_browser: "${{ steps.reuse.outputs.run_browser }}"
      run_layout: "${{ steps.reuse.outputs.run_layout }}"
      red_main_oid: "${{ steps.plan.outputs.red_main_oid }}"
      base_sha: "${{ steps.admit.outputs.base_sha }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: "Refuse a stale, ready, closed or foreign head; yield to ready confirmation"
        id: admit
        env:
          FEEDBACK_PR: "${{ inputs.pr }}"
          FEEDBACK_HEAD_SHA: "${{ inputs.head_sha }}"
          GH_TOKEN: "${{ github.token }}"
        run: bun scripts/heavy-feedback.ts admit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - run: bun install --frozen-lockfile
      - name: Refuse doomed proof while main is red
        env:
          PR_NUMBER: "${{ inputs.pr }}"
        run: bun scripts/red-main-cli.ts gate
      - name: "Plan the PR's affected selection with feedback-heavy cadence"
        id: plan
        env:
          BASE_SHA: "${{ steps.admit.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Select fresh browser and layout execution
        id: reuse
        run: bun scripts/proof-reuse.ts
  verify:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.verify == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: verify_install
        timeout-minutes: 1
        run: bun install --frozen-lockfile
      - name: Recompute the same affected selection
        id: verify_plan
        timeout-minutes: 1
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Strict types and curated fast tests concurrently on this runner
        id: verify_proof
        timeout-minutes: 4
        env:
          CI_COMMAND_RECEIPTS: tmp/verify-commands.jsonl
        run: bun scripts/ci-runner.ts
      - name: Verify setup and proof outcomes (best effort)
        if: always()
        env:
          INSTALL_OUTCOME: "${{ steps.verify_install.outcome }}"
          PLAN_OUTCOME: "${{ steps.verify_plan.outcome }}"
          PROOF_OUTCOME: "${{ steps.verify_proof.outcome }}"
          CI_COMMAND_RECEIPTS: tmp/verify-commands.jsonl
        run: bun scripts/ci-verify-summary.ts
  pack:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.pack == 'true' }}"
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build --jobs=2
      - name: "Pack, install and probe every publishable package"
        run: bun scripts/ci-pack.ts
  unit:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.unit == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: "${{ fromJSON(needs.changeset.outputs.unit_shards) }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --backend=copyfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        id: runtime_setup
        timeout-minutes: 12
        run: bash scripts/ci-runtime-setup.sh
      - name: Complete unit proof
        id: runtime_proof
        timeout-minutes: 30
        env:
          UNIT_SHARDS: "${{ strategy.job-total }}"
        run: "bun scripts/ci-proof.ts unit --shard=${{ matrix.shard }}/\"$UNIT_SHARDS\""
      - name: Environment setup and proof outcomes
        if: always()
        env:
          SETUP_OUTCOME: "${{ steps.runtime_setup.outcome }}"
          PROOF_OUTCOME: "${{ steps.runtime_proof.outcome }}"
        run: "printf 'Environment setup (infrastructure prerequisite, 12-minute limit): %s\\nProof (30-minute limit): %s\\n' \\\n  \"$SETUP_OUTCOME\" \"$PROOF_OUTCOME\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "unit-proof-${{ matrix.shard }}"
          path: "tmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/unit-memory.jsonl\ntmp/unit-report.xml\ntmp/unit-report-summary.json\ntmp/unit-worker-*.xml\ntmp/unit-worker-*.json\ntmp/unit-worker-diagnostics/\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  runtime:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.runtime == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        id: runtime_setup
        timeout-minutes: 12
        run: bash scripts/ci-runtime-setup.sh --native
      - name: Complete runtime proof
        id: runtime_proof
        timeout-minutes: 15
        run: bun scripts/ci-proof.ts runtime
      - name: Environment setup and proof outcomes
        if: always()
        env:
          SETUP_OUTCOME: "${{ steps.runtime_setup.outcome }}"
          PROOF_OUTCOME: "${{ steps.runtime_proof.outcome }}"
        run: "printf 'Environment setup (infrastructure prerequisite, 12-minute limit): %s\\nProof (15-minute limit): %s\\n' \\\n  \"$SETUP_OUTCOME\" \"$PROOF_OUTCOME\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-proof
          path: "tmp/native-host-proof/\ntmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  runtime_host:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.runtime_host == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Real Chrome and offline Linux namespace prerequisites
        id: runtime_setup
        timeout-minutes: 12
        run: bash scripts/ci-runtime-setup.sh --native
      - name: Start btrfs dead-root kernel trace
        run: "mkdir -p tmp/native-host-proof\nsudo bash scripts/native-proof/dead-root-trace.sh start tmp/native-host-proof/dead-root-trace.txt\n"
      - name: Start optional owned-loop kernel trace
        continue-on-error: true
        run: sudo python3 -I -S scripts/native-proof/loop-trace.py start tmp/native-host-proof/owned-loop-trace.json
      - name: Complete native hosted runtime proof
        id: runtime_proof
        timeout-minutes: 15
        run: bun scripts/ci-proof.ts runtime_host
      - name: Stop optional owned-loop kernel trace
        continue-on-error: true
        if: always()
        run: sudo python3 -I -S scripts/native-proof/loop-trace.py stop
      - name: Stop and classify btrfs dead-root kernel trace
        if: always()
        run: "sudo bash scripts/native-proof/dead-root-trace.sh stop\nif [ -f tmp/native-host-proof/dead-root-trace.txt ]; then\n  bun scripts/native-proof/dead-root-trace.ts tmp/native-host-proof/dead-root-trace.txt tmp/native-host-proof\nfi\n"
      - name: Environment setup and proof outcomes
        if: always()
        env:
          SETUP_OUTCOME: "${{ steps.runtime_setup.outcome }}"
          PROOF_OUTCOME: "${{ steps.runtime_proof.outcome }}"
        run: "printf 'Environment setup (infrastructure prerequisite, 12-minute limit): %s\\nProof (15-minute limit): %s\\n' \\\n  \"$SETUP_OUTCOME\" \"$PROOF_OUTCOME\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-host-proof
          path: "tmp/native-host-proof/\ntmp/reference-pool-proof/\ntmp/worker-identity-proof/\ntmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  browser:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.browser == 'true' && needs.changeset.outputs.run_browser == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Complete browser proof
        run: "bun scripts/ci-proof.ts browser --shard=${{ matrix.shard }}/3"
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "browser-proof-${{ matrix.shard }}"
          path: "tmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/proof-cases.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/diagram-export-native-prepared/*/*/release.svg\ntmp/diagram-export-native-prepared/*/*/release.png\ntmp/diagram-export-native-prepared/*/*/release.pdf\ntmp/diagram-export-native-prepared/*/*/origin.svg\ntmp/diagram-export-native-prepared/*/*/origin.png\ntmp/diagram-export-native-prepared/*/*/origin.pdf\ntmp/diagram-export-native-prepared/*/*/producer.json\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  layout:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.layout == 'true' && needs.changeset.outputs.run_layout == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Complete layout proof
        run: "bun scripts/ci-proof.ts layout --shard=${{ matrix.shard }}/2"
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "layout-proof-${{ matrix.shard }}"
          path: "tmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/proof-cases.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/hygiene-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  captures:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.captures == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Complete captures proof
        run: bun scripts/ci-proof.ts captures
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-proof
          path: "tmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  endurance:
    needs: changeset
    if: "${{ !cancelled() && (needs.changeset.result == 'success' || github.event_name == 'push') && needs.changeset.outputs.endurance == 'true' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ inputs.head_sha }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Recompute affected proof on the actual checkout
        env:
          BASE_SHA: "${{ needs.changeset.outputs.base_sha }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          FEEDBACK_PR: "${{ inputs.pr }}"
        run: bun scripts/ci-plan.ts
      - name: Complete endurance proof
        run: bun scripts/ci-proof.ts endurance
      - name: Proof receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endurance-proof
          path: "tmp/proof-checkout.json\ntmp/proof-resources.json\ntmp/proof-cases.json\ntmp/unit-report.xml\ntmp/unit-timings.json\ntmp/measure-claude-*.json\ntmp/*-probe.json\ntmp/feature-capture-verification/\npackages/ui-kit/.vitest-attachments/\npackages/ui-react/.vitest-attachments/\n.vitest-attachments/\ntmp/diagram-renderer-proof/\ntmp/mermaid-renderer-proof/\ntmp/diagram-export-proof/\ntmp/cold-capture/\ntmp/share-review/\ntmp/svg-proof/\npackages/ui-kit/**/__screenshots__/**/*-[0-9]*.png\npackages/ui-react/**/__screenshots__/**/*-[0-9]*.png\n!packages/ui-kit/**/__screenshots__/**/*-linux.png\n!packages/ui-react/**/__screenshots__/**/*-linux.png\n"
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  aggregate:
    name: draft heavy feedback
    needs:
      - changeset
      - verify
      - pack
      - unit
      - runtime
      - runtime_host
      - browser
      - layout
      - captures
      - endurance
    if: "${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
