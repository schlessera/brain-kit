        env:
          FEEDBACK_PR: "${{ inputs.pr }}"
          FEEDBACK_HEAD_SHA: "${{ inputs.head_sha }}"
          GH_TOKEN: "${{ github.token }}"
          PROOF_NEEDS: "${{ toJSON(needs) }}"
        run: bun scripts/heavy-feedback.ts aggregate