# Daily compaction of the hourly ci-timings artifacts into the permanent
# measurement data ref (docs/decisions/ci-evidence.md). Measurement only: never
# a proof/merge gate. Executes trusted default-branch tooling with no dependency
# install; downloaded artifacts are parsed as data, never sourced or executed.
name: ci-evidence-archive

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Use the larger backfill request budget; dispatch again until the summary reports nothing pending
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

permissions: {}

# One writer at a time from this workflow; the exact lease still guards every push.
concurrency:
  group: ci-evidence-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # only this job writes refs/heads/brain-ci-metrics
      actions: read    # list and download the ci-timings artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The data-ref push authenticates with this job's token.
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Archive every retained ci-timings artifact not yet on the data ref
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_REPO: ${{ github.repository }}
          ARCHIVE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARCHIVE_BUDGET: ${{ inputs.backfill && '450' || '120' }}
        run: |
          mkdir -p tmp
          bun scripts/ci-timings.ts archive --repo "$ARCHIVE_REPO" --branch "$ARCHIVE_DEFAULT_BRANCH" --request-budget "$ARCHIVE_BUDGET" --reserve 500 | tee tmp/archive-result.json
      - name: Summarize the archive update
        if: always()
        run: |
          if [ -s tmp/archive-result.json ]; then
            { echo '## CI evidence archive'; echo; echo '```json'; cat tmp/archive-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
