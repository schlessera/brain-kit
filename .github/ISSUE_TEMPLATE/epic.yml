name: Epic
description: A theme of work that lands as several tasks. Never coded directly.
title: "Epic: <the outcome, not the work>"
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is a tracking issue. Its body holds the shared context every
        sub-issue would otherwise repeat, and its sub-issue list is the plan.
        Nobody writes code against an epic.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this closes, stated as a fact about the system rather than a list of work.
      placeholder: The container runs the server as an unprivileged user and the agent as a second one, with no path by which repository content executes as root.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: >-
        What makes this worth doing, and what it unblocks. If it came from a
        review, an incident or a spike, link that and say which findings it
        closes.
    validations:
      required: true

  - type: textarea
    id: shared-context
    attributes:
      label: Shared context
      description: >-
        The background every sub-issue needs: the files, the constraints, the
        decisions already made. Written once here so the tasks can be short.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: >-
        What this may not change. Binding decisions from ROADMAP.md and
        docs/decisions/ that apply, and the things a reader will suggest that
        are deliberately out.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Breakdown
      description: >-
        The tasks, in the order they can land. Leave as prose until the
        sub-issues exist, then let GitHub's sub-issue list carry it.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How the epic is judged closed, beyond "every sub-issue is closed".
    validations:
      required: true
