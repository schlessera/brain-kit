<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="relay-desktop-light-focus-title relay-desktop-light-focus-description" data-layout="desktop" data-theme="light">
<title id="relay-desktop-light-focus-title">The homecoming relay</title>
<desc id="relay-desktop-light-focus-description">Eight nodes: Odysseus’s phone captures to the inbox; News from Sparta reaches source-watch, which delivers to the inbox. The inbox feeds note-filer, which updates the crew ledger and voyage notes and sends a digest to Penelope on Ithaca. 06:40 on Ogygia, 2026-07-12; Ithaca is one hour ahead.</desc>
