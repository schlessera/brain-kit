<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1088" viewBox="0 0 320 1088" role="img" aria-labelledby="relay-narrow-print-title relay-narrow-print-description" data-layout="narrow" data-theme="print">
<title id="relay-narrow-print-title">The homecoming relay</title>
<desc id="relay-narrow-print-description">Eight nodes: Odysseus’s phone captures to the inbox; News from Sparta reaches source-watch, which delivers to the inbox. The inbox feeds note-filer, which updates the crew ledger and voyage notes and sends a digest to Penelope on Ithaca. 06:40 on Ogygia, 2026-07-12; Ithaca is one hour ahead.</desc>
